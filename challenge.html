<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Challenge | JAMB CBT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8f6;color:#13251b;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3ebe5;padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center}.top a{color:#087f45;text-decoration:none;font-weight:700}
.wrap{width:min(760px,100%);margin:auto;padding:18px 14px 32px}.hero,.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:14px}.hero h1{margin:6px 0}.hero small{color:#087f45;font-weight:800}.status{margin-top:12px;background:#eef8f1;border-radius:12px;padding:11px;font-weight:700}.question{border:1px solid #e3ebe5;border-radius:15px;padding:16px;margin-bottom:14px}.qnum{font-size:12px;color:#087f45;font-weight:800;margin-bottom:9px}.qtext{font-size:17px;font-weight:700;line-height:1.45;margin-bottom:12px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d8e2db;border-radius:11px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}.option.selected{border-color:#087f45;background:#eef8f1}.option.correct{border-color:#087f45;background:#e4f6ea}.option.wrong{border-color:#c73b3b;background:#fff0f0}.option:disabled{cursor:default}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:#087f45;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.6}.result{display:none;margin-top:14px;padding:16px;border-radius:14px;background:#eef8f1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:#f6faf7;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.leader{margin-top:18px}.leader table{width:100%;border-collapse:collapse}.leader th,.leader td{text-align:left;padding:9px 6px;border-bottom:1px solid #e6ece8;font-size:14px}.leader .me{font-weight:800;background:#eef8f1}.message{padding:16px;border-radius:14px;background:#f7faf8}.back{display:block;text-align:center;color:#087f45;font-weight:700;text-decoration:none;margin-top:14px}@media(max-width:420px){.wrap{padding:12px 10px 28px}.hero,.card{padding:15px;border-radius:15px}.qtext{font-size:16px}.top{padding-left:12px;padding-right:12px}}
</style></head>
<body><header class="top"><strong>⚡ Daily Challenge</strong><a href="dashboard.html">← Dashboard</a></header>
<main class="wrap"><section class="hero"><small>JAMB CBT DAILY CHALLENGE</small><h1>Today's Challenge</h1><p>Complete your daily set and keep your preparation consistent.</p><div class="status" id="challengeStatus">Checking your account…</div><div class="stats"><div class="stat">🔥 Streak<b id="streak">0 days</b></div><div class="stat">🏆 Rank<b id="rank">—</b></div></div></section>
<section class="card" id="challengeCard"><div class="message">Checking today's challenge…</div></section>
<section class="card leader"><h2>🏆 Leaderboard</h2><div id="leaderboard"><div class="message">Loading leaderboard…</div></div></section>
<a class="back" href="dashboard.html">Return to dashboard</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://afdnfqmsjmpwlvhloopy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_LQlMraaULDTdAKeYysPWkA_a8CKvA1V';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null,questions=[],answers={},submitted=false,challengeDate='';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayBefore(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()-n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function normalizeSubscriptionState(row){
     if(!row) return false;
     const status = String(row.status ?? row.subscription_status ?? row.plan_status ?? row.payment_status ?? '').trim().toLowerCase();
     const expiresAt = row.expires_at ?? row.expiresAt ?? row.current_period_end ?? row.ends_at ?? null;
     const isStatusActive = ['active','paid','premium','subscribed','success','successful','succeeded','completed'].includes(status);
     let notExpired = true;
     if (expiresAt) {
       const exp = new Date(expiresAt);
       notExpired = !Number.isNaN(exp.getTime()) ? exp > new Date() : true;
     }
     return isStatusActive && notExpired;
}

async function isPremium(uid){
     try {
       const {data,error}=await client.from('subscriptions').select('*').eq('user_id',uid);
       if(error) throw error;
       const rows = Array.isArray(data) ? data : [];
       if (rows.length === 0) {
         return false;
       }
       return rows.some(normalizeSubscriptionState);
     } catch (e) {
       console.warn('Subscription state check failed. Using authenticated session state only.', e);
       return false;
     }
}

async function getDisplayName(){try{const {data}=await client.from('Student_profiles').select('*').eq('id',user.id).maybeSingle();if(data)return data.Full_name||data.full_name||data.fullName||data.name||data.Username||data.username||user.user_metadata?.full_name||user.email?.split('@')[0]||'Student';}catch(e){}return user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'Student';}
function showError(message){document.getElementById('challengeCard').innerHTML=`<div class="message"><h2>⚠️ Daily Challenge could not load</h2><p>${esc(message)}</p><p>Please refresh the page. If it continues, check your Supabase connection and Questions table policies.</p></div>`;}
async function loadStats(){
 const today=localDate();
 let rows=[];
 try {
   const {data,error}=await client.from('challenge_leaderboard').select('challenge_date,score,total,user_id,display_name,completed_at').order('challenge_date',{ascending:false}).order('score',{ascending:false}).limit(1000);
   if(error) throw error;
   rows = data || [];
 } catch (error) {
   const {data,error:legacyError}=await client.from('challenge_attempts').select('challenge_date,score,total,user_id,display_name,completed_at').order('challenge_date',{ascending:false}).order('score',{ascending:false}).limit(1000);
   if(legacyError) throw legacyError;
   rows = data || [];
 }
 const mine=rows.filter(r=>r.user_id===user.id);
 const dates=new Set(mine.map(r=>String(r.challenge_date).slice(0,10)));
 let streak=0;
 if(dates.has(today)){streak=1;while(dates.has(dayBefore(today,streak)))streak++;}
 else {const yesterday=dayBefore(today,1);if(dates.has(yesterday)){streak=1;while(dates.has(dayBefore(yesterday,streak)))streak++;}}
 document.getElementById('streak').textContent=streak+' day'+(streak===1?'':'s');
 const best=new Map();
 rows.forEach(r=>{const old=best.get(r.user_id);if(!old||Number(r.score)>Number(old.score))best.set(r.user_id,r);});
 const ranking=[...best.values()].sort((a,b)=>Number(b.score)-Number(a.score)||Number(b.total)-Number(a.total)||String(a.display_name||'').localeCompare(String(b.display_name||'')));
 const rank=ranking.findIndex(r=>r.user_id===user.id)+1;
 document.getElementById('rank').textContent=rank>0?'#'+rank:'—';
 const top=ranking.slice(0,20);
 document.getElementById('leaderboard').innerHTML=top.length?'<table><thead><tr><th>#</th><th>Student</th><th>Score</th></tr></thead><tbody>'+top.map((r,i)=>'<tr class="'+(r.user_id===user.id?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(r.display_name||'Student')+(r.user_id===user.id?' (You)':'')+'</td><td>'+esc(r.score)+'/'+esc(r.total)+'</td></tr>').join('')+'</tbody></table>':'<div class="message">No completed challenges yet.</div>';
 return {today,mine};
}
async function loadQuestions(count,date){
 const {data,error}=await client.from('Questions').select('id,Subject,Question,Option_a,Option_b,Option_c,Option_d,Correct_Answer,Explanation,Topic').eq('test_type','practice').eq('is_active',true).order('id',{ascending:true});
 if(error) throw error;
 const valid=(Array.isArray(data)?data:[]).filter(q=>q && q.Question && q.Option_a && q.Option_b && q.Option_c && q.Option_d && q.Correct_Answer);
 if(valid.length < count) throw new Error('Only '+valid.length+' valid active practice questions are available for the current challenge.');
 const seed = hash(`${user.id}|${date}`);
 const pool = [...valid];
 for (let i = pool.length - 1; i > 0; i--) {
const j = Math.abs(Math.floor((seed * (i + 1) * 17 + 13) % (i + 1))) % (i + 1);
[pool[i], pool[j]] = [pool[j], pool[i]];
 }
 return pool.slice(0, count);
}
async function load(){
  try{
    const {data,error}=await client.auth.getSession();
    if(error) throw error;

    if(!data.session){
      location.href='student.html';
      return;
    }

    user=data.session.user;
    challengeDate=localDate();

    // Daily Challenge is available to everyone.
    // Free users receive 5 questions; Premium users receive 15 questions.
    const premium=await isPremium(user.id);
    const count=premium?15:5;

    const status=document.getElementById('challengeStatus');
    if(status){
      status.textContent=(premium?'Premium plan • ':'Free plan • ')+count+' questions per day';
    }

    const stats=await loadStats();

    if(stats.mine.some(r=>String(r.challenge_date).slice(0,10)===challengeDate)){
      const card=document.getElementById('challengeCard');
      if(card){
        card.innerHTML='<div class="message"><h2>✅ Today’s Challenge Completed</h2><p>You have already completed today’s '+(premium?'Premium':'Free')+' challenge.</p><p>Come back tomorrow for your next challenge.</p></div>';
      }
      return;
    }

    questions=await loadQuestions(count,challengeDate);
    render();
  }catch(e){
    console.error('Daily Challenge load error:',e);
    showError(e?.message||'Unknown loading error.');
  }
}
function render(){
 const card=document.getElementById('challengeCard');
 card.innerHTML=questions.map((q,i)=>`<div class="question"><div class="qnum">QUESTION ${i+1} • ${esc(q.Subject)}</div><div class="qtext">${esc(q.Question)}</div>${[['A',q.Option_a],['B',q.Option_b],['C',q.Option_c],['D',q.Option_d]].map(([k,v])=>`<button type="button" class="option" id="opt-${i}-${k}" onclick="choose(${i},'${k}')"><b>${k}.</b> ${esc(v)}</button>`).join('')}</div>`).join('')+'<button class="submit" onclick="submitChallenge()">Submit Challenge</button><div class="result" id="result"></div>';
}
function choose(i,k){if(submitted)return;answers[i]=k;document.querySelectorAll(`[id^="opt-${i}-"]`).forEach(x=>x.classList.remove('selected'));document.getElementById(`opt-${i}-${k}`).classList.add('selected');}
async function submitChallenge(){
 if(submitted)return;
 const submitButton=document.querySelector('.submit');
 if(submitButton){submitButton.disabled=true;submitButton.textContent='Submitting…';}
 let score=0;
 questions.forEach((q,i)=>{const chosen=answers[i],correct=String(q.Correct_Answer||'').trim().toUpperCase();if(chosen===correct)score++;});
 const saved=await saveChallengeResult(score);
 if(!saved){if(submitButton){submitButton.disabled=false;submitButton.textContent='Submit Challenge';}return;}
 submitted=true;
 questions.forEach((q,i)=>{const chosen=answers[i],correct=String(q.Correct_Answer||'').trim().toUpperCase();document.querySelectorAll(`[id^="opt-${i}-"]`).forEach(x=>x.disabled=true);if(chosen){const el=document.getElementById(`opt-${i}-${chosen}`);if(chosen===correct)el.classList.add('correct');else{el.classList.add('wrong');const right=document.getElementById(`opt-${i}-${correct}`);if(right)right.classList.add('correct');}}});
 const pct=Math.round(score/questions.length*100);const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<strong>You scored ${score}/${questions.length} (${pct}%).</strong><p style="margin:8px 0 0">🔥 Your streak and 🏆 leaderboard have been updated.</p>`;
 await loadStats();
}
async function saveChallengeResult(score){
 const today=localDate();
 try{
  const {data:existing,error:checkError}=await client.from('challenge_attempts').select('id,score,total').eq('user_id',user.id).eq('challenge_date',today).maybeSingle();
  if(checkError)throw checkError;
  if(existing){document.getElementById('challengeCard').innerHTML='<div class="message"><h2>✅ Today’s Challenge Completed</h2><p>Your challenge for today has already been recorded.</p></div>';return true;}
  const displayName=await getDisplayName();
  const payload={user_id:user.id,display_name:displayName,challenge_date:today,score,total:questions.length,completed_at:new Date().toISOString()};
  const {error}=await client.from('challenge_attempts').upsert(payload,{onConflict:'user_id,challenge_date'});
  if(error){if(String(error.code)==='23505'){document.getElementById('challengeCard').innerHTML='<div class="message"><h2>✅ Today’s Challenge Completed</h2><p>Your challenge has already been recorded.</p></div>';return true;}throw error;}
  return true;
 }catch(e){console.error('Challenge result save error:',e);alert('Your challenge could not be saved: '+(e?.message||'Unknown error'));return false;}
}
load();
</script></body></html>
