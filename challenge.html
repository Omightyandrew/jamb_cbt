/* =====================================================

const SUPABASE_URL =
  'https://afdnfqmsjmpwlvhloopy.supabase.co';

  'sb_publishable_LQlMraaULDTdAKeYysPWkA_a8CKvA1V';

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBAL STATE
===================================================== */

let user = null;
let questions = [];
let answers = {};
let submitted = false;
let challengeDate = '';


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(value ?? '')
    .replace(
      /[&<>'"]/g,
      character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[character])
    );

}


/* =====================================================
   LOCAL DATE
===================================================== */

function localDate(){

  const d =
    new Date();

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   GET PREVIOUS DATE
===================================================== */

function dayBefore(
  dateStr,
  numberOfDays
){

  const d =
    new Date(
      dateStr +
      'T12:00:00'
    );

  d.setDate(
    d.getDate() -
    numberOfDays
  );

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   HASH
===================================================== */

function hash(string){

  let h =
    2166136261;

  for(
    let i = 0;
    i < string.length;
    i++
  ){

    h ^=
      string.charCodeAt(i);

    h =
      Math.imul(
        h,
        16777619
      );

  }

  return h >>> 0;

}


/* =====================================================
   SEEDED RANDOM NUMBER
===================================================== */

function createSeededRandom(
  seed
){

  let current =
    seed >>> 0;


  return function(){

    current =
      (
        current * 1664525 +
        1013904223
      ) >>> 0;


    return (
      current /
      4294967296
    );

  };

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(
  array,
  random
){

  const result =
    [...array];


  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =====================================================
   SUBSCRIPTION STATUS
===================================================== */

function normalizeSubscriptionState(
  row
){

  if(!row){

    return false;

  }


  const status =
    String(
      row.status ??
      row.subscription_status ??
      row.plan_status ??
      row.payment_status ??
      ''
    )
    .trim()
    .toLowerCase();


  const expiresAt =
    row.expires_at ??
    row.expiresAt ??
    row.current_period_end ??
    row.ends_at ??
    null;


  const isStatusActive =
    [
      'active',
      'paid',
      'premium',
      'subscribed',
      'success',
      'successful',
      'succeeded',
      'completed'
    ].includes(status);


  let notExpired =
    true;


  if(expiresAt){

    const expiry =
      new Date(
        expiresAt
      );


    notExpired =
      !Number.isNaN(
        expiry.getTime()
      )
      ? expiry > new Date()
      : true;

  }


  return (
    isStatusActive &&
    notExpired
  );

}


/* =====================================================
   PREMIUM CHECK
===================================================== */

async function isPremium(
  uid
){

  try{

    const {
      data,
      error
    } =
      await client
        .from('subscriptions')
        .select('*')
        .eq(
          'user_id',
          uid
        );


    if(error){

      throw error;

    }


    const rows =
      Array.isArray(data)
        ? data
        : [];


    if(
      rows.length === 0
    ){

      return false;

    }


    return rows.some(
      normalizeSubscriptionState
    );


  }catch(error){

    console.warn(
      'Subscription check failed:',
      error
    );


    return false;

  }

}


/* =====================================================
   DISPLAY NAME
===================================================== */

async function getDisplayName(){

  try{

    const {
      data,
      error
    } =
      await client
        .from('Student_profiles')
        .select('*')
        .eq(
          'id',
          user.id
        )
        .maybeSingle();


    if(
      !error &&
      data
    ){

      return (
        data.Full_name ||
        data.full_name ||
        data.fullName ||
        data.name ||
        data.Username ||
        data.username ||
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split('@')[0] ||
        'Student'
      );

    }

  }catch(error){

    console.warn(
      'Display name lookup failed:',
      error
    );

  }


  return (
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email?.split('@')[0] ||
    'Student'
  );

}

/* =====================================================
   LOAD LEADERBOARD + STREAK
===================================================== */

async function loadStats(){

  const today =
    localDate();


  let rows = [];


  try{

    /*
     * Challenge results are stored in
     * challenge_attempts.
     */

    const {
      data,
      error
    } =
      await client
        .from('challenge_attempts')
        .select(
          'challenge_date,score,total,user_id,display_name,completed_at'
        )
        .order(
          'challenge_date',
          {
            ascending:false
          }
        )
        .order(
          'score',
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    rows =
      Array.isArray(data)
        ? data
        : [];


  }catch(error){

    console.error(
      'Leaderboard load error:',
      error
    );


    const leaderboard =
      document.getElementById(
        'leaderboard'
      );


    if(leaderboard){

      leaderboard.innerHTML = `
        <div class="message">
          Leaderboard could not be loaded right now.
        </div>
      `;

    }


    document.getElementById(
      'rank'
    ).textContent =
      '—';


    return {
      today,
      mine:[]
    };

  }


  /* ===================================================
     MY CHALLENGE HISTORY
  =================================================== */

  const mine =
    rows.filter(
      row =>
        String(
          row.user_id
        ) ===
        String(
          user.id
        )
    );


  /* ===================================================
     STREAK
  =================================================== */

  const dates =
    new Set(
      mine.map(
        row =>
          String(
            row.challenge_date
          ).slice(0,10)
      )
    );


  let streak =
    0;


  if(
    dates.has(today)
  ){

    streak =
      1;


    while(
      dates.has(
        dayBefore(
          today,
          streak
        )
      )
    ){

      streak++;

    }

  }else{

    const yesterday =
      dayBefore(
        today,
        1
      );


    if(
      dates.has(yesterday)
    ){

      streak =
        1;


      while(
        dates.has(
          dayBefore(
            yesterday,
            streak
          )
        )
      ){

        streak++;

      }

    }

  }


  const streakElement =
    document.getElementById(
      'streak'
    );


  if(streakElement){

    streakElement.textContent =
      streak +
      ' day' +
      (
        streak === 1
          ? ''
          : 's'
      );

  }


  /* ===================================================
     TODAY'S RECORDS ONLY
  =================================================== */

  const todayRows =
    rows.filter(
      row =>
        String(
          row.challenge_date
        ).slice(0,10) ===
        today
    );


  /* ===================================================
     ONE RECORD PER STUDENT
  =================================================== */

  const bestTodayByUser =
    new Map();


  todayRows.forEach(
    row => {

      const studentId =
        String(
          row.user_id
        );


      const old =
        bestTodayByUser.get(
          studentId
        );


      if(
        !old ||
        Number(row.score) >
        Number(old.score)
      ){

        bestTodayByUser.set(
          studentId,
          row
        );

      }

    }
  );


  /* ===================================================
     RANKING
  =================================================== */

  const ranking =
    [...bestTodayByUser.values()]
      .sort(
        (a,b) => {

          const scoreA =
            Number(a.score) ||
            0;


          const scoreB =
            Number(b.score) ||
            0;


          if(
            scoreB !== scoreA
          ){

            return (
              scoreB -
              scoreA
            );

          }


          const totalA =
            Number(a.total) ||
            0;


          const totalB =
            Number(b.total) ||
            0;


          if(
            totalB !== totalA
          ){

            return (
              totalB -
              totalA
            );

          }


          const timeA =
            new Date(
              a.completed_at
            ).getTime() ||
            0;


          const timeB =
            new Date(
              b.completed_at
            ).getTime() ||
            0;


          return (
            timeA -
            timeB
          );

        }
      );


  /* ===================================================
     CURRENT USER RANK
  =================================================== */

  const myRank =
    ranking.findIndex(
      row =>
        String(
          row.user_id
        ) ===
        String(
          user.id
        )
    ) + 1;


  const rankElement =
    document.getElementById(
      'rank'
    );


  if(rankElement){

    rankElement.textContent =
      myRank > 0
        ? '#' + myRank
        : '—';

  }


  /* ===================================================
     TOP 10
  =================================================== */

  const top10 =
    ranking.slice(
      0,
      10
    );


  const leaderboard =
    document.getElementById(
      'leaderboard'
    );


  if(!leaderboard){

    return {
      today,
      mine
    };

  }


  if(
    !top10.length
  ){

    leaderboard.innerHTML = `

      <div class="message">
        No completed challenges yet today.
      </div>

    `;


    return {
      today,
      mine
    };

  }


  leaderboard.innerHTML = `

    <table>

      <thead>

        <tr>

          <th>#</th>
          <th>Student</th>
          <th>Score</th>

        </tr>

      </thead>

      <tbody>

        ${

          top10
            .map(
              (row,index) => {

                const isMe =
                  String(
                    row.user_id
                  ) ===
                  String(
                    user.id
                  );


                const name =
                  row.display_name ||
                  'Student';


                return `

                  <tr
                    class="${
                      isMe
                        ? 'me'
                        : ''
                    }"
                  >

                    <td>
                      ${index + 1}
                    </td>

                    <td>

                      ${esc(name)}

                      ${
                        isMe
                          ? ' (You)'
                          : ''
                      }

                    </td>

                    <td>
                      ${esc(row.score)}/${esc(row.total)}
                    </td>

                  </tr>

                `;

              }
            )
            .join('')

        }

      </tbody>

    </table>

  `;


  return {
    today,
    mine
  };

}


/* =====================================================
   LOAD CHALLENGE QUESTIONS
===================================================== */

async function loadQuestions(
  count,
  date
){

  const {
    data,
    error
  } =
    await client
      .from('Questions')
      .select(
        'id,Subject,Question,Option_a,Option_b,Option_c,Option_d,Correct_Answer,Explanation,Topic'
      )
      .eq(
        'test_type',
        'practice'
      )
      .eq(
        'is_active',
        true
      );


  if(error){

    throw error;

  }


  const valid =
    (
      Array.isArray(data)
        ? data
        : []
    )
    .filter(
      q =>

        q &&
        q.id !== null &&
        q.id !== undefined &&
        q.Subject &&
        q.Question &&
        q.Option_a &&
        q.Option_b &&
        q.Option_c &&
        q.Option_d &&
        q.Correct_Answer

    );


  if(
    valid.length < count
  ){

    throw new Error(
      'Only ' +
      valid.length +
      ' valid active practice questions are available for the challenge.'
    );

  }


  /* ===================================================
     PROPER SEEDED RANDOMIZER
  =================================================== */

  const seed =
    hash(
      `${user.id}|${date}`
    );


  const random =
    createSeededRandom(
      seed
    );


  const shuffled =
    shuffleArray(
      valid,
      random
    );


  /* ===================================================
     GROUP QUESTIONS BY SUBJECT
  =================================================== */

  const subjectGroups =
    new Map();


  shuffled.forEach(
    question => {

      const subject =
        String(
          question.Subject
        ).trim();


      if(
        !subjectGroups.has(
          subject
        )
      ){

        subjectGroups.set(
          subject,
          []
        );

      }


      subjectGroups
        .get(subject)
        .push(question);

    }
  );


  /*
   * Shuffle the available subject names.
   */

  const subjects =
    shuffleArray(
      [...subjectGroups.keys()],
      random
    );


  /* ===================================================
     SELECT DIFFERENT SUBJECTS FIRST
  =================================================== */

  const selected = [];
  const usedIds = new Set();


  /*
   * First pass:
   * take one question from each subject.
   *
   * This prevents English from filling
   * the entire challenge.
   */

  for(
    const subject of subjects
  ){

    const group =
      subjectGroups.get(
        subject
      );


    if(
      !group ||
      !group.length
    ){

      continue;

    }


    const question =
      group.shift();


    if(!question){

      continue;

    }


    selected.push(
      question
    );


    usedIds.add(
      String(
        question.id
      )
    );


    if(
      selected.length >= count
    ){

      break;

    }

  }


  /* ===================================================
     FILL REMAINING QUESTIONS
  =================================================== */

  if(
    selected.length < count
  ){

    for(
      const question of shuffled
    ){

      const id =
        String(
          question.id
        );


      if(
        usedIds.has(id)
      ){

        continue;

      }


      selected.push(
        question
      );


      usedIds.add(id);


      if(
        selected.length >= count
      ){

        break;

      }

    }

  }


  /*
   * Final shuffle:
   *
   * Mix the selected questions so that
   * subjects do not always appear in the
   * same order.
   */

  return shuffleArray(
    selected.slice(
      0,
      count
    ),
    random
  );

}


/* =====================================================
   LOAD PAGE
===================================================== */

async function load(){

  try{

    const {
      data,
      error
    } =
      await client.auth.getSession();


    if(error){

      throw error;

    }


    if(
      !data.session
    ){

      location.href =
        'student.html';

      return;

    }


    user =
      data.session.user;


    challengeDate =
      localDate();


    /* =================================================
       PREMIUM LIMIT
    ================================================= */

    const premium =
      await isPremium(
        user.id
      );


    const count =
      premium
        ? 15
        : 5;


    const status =
      document.getElementById(
        'challengeStatus'
      );


    if(status){

      status.textContent =
        (
          premium
            ? 'Premium plan • '
            : 'Free plan • '
        ) +
        count +
        ' questions per day';

    }


    /* =================================================
       LOAD STATS
    ================================================= */

    const stats =
      await loadStats();


    /* =================================================
       CHECK TODAY'S SUBMISSION
    ================================================= */

    if(
      stats.mine.some(
        row =>
          String(
            row.challenge_date
          ).slice(0,10) ===
          challengeDate
      )
    ){

      const card =
        document.getElementById(
          'challengeCard'
        );


      if(card){

        card.innerHTML = `

          <div class="message">

            <h2>
              ✅ Today’s Challenge Completed
            </h2>

            <p>
              You have already completed today's
              ${
                premium
                  ? 'Premium'
                  : 'Free'
              }
              challenge.
            </p>

            <p>
              Come back tomorrow for your next challenge.
            </p>

          </div>

        `;

      }


      return;

    }


    /* =================================================
       LOAD QUESTIONS
    ================================================= */

    questions =
      await loadQuestions(
        count,
        challengeDate
      );


    render();


  }catch(error){

    console.error(
      'Daily Challenge load error:',
      error
    );


    showError(
      error?.message ||
      'Unknown loading error.'
    );

  }

}


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function render(){

  const card =
    document.getElementById(
      'challengeCard'
    );


  if(!card){

    return;

  }


  card.innerHTML =

    questions
      .map(
        (question,index) => `

          <div class="question">

            <div class="qnum">

              QUESTION ${index + 1}

              •

              ${esc(
                question.Subject
              )}

            </div>


            <div class="qtext">

              ${esc(
                question.Question
              )}

            </div>


            ${

              [
                [
                  'A',
                  question.Option_a
                ],
                [
                  'B',
                  question.Option_b
                ],
                [
                  'C',
                  question.Option_c
                ],
                [
                  'D',
                  question.Option_d
                ]
              ]
              .map(
                ([letter,text]) => `

                  <button
                    type="button"
                    class="option"
                    id="opt-${index}-${letter}"
                    onclick="choose(${index},'${letter}')"
                  >

                    <b>
                      ${letter}.
                    </b>

                    ${esc(text)}

                  </button>

                `
              )
              .join('')

            }

          </div>

        `
      )
      .join('') +

    `

      <button
        class="submit"
        onclick="submitChallenge()"
      >
        Submit Challenge
      </button>

      <div
        class="result"
        id="result"
      ></div>

    `;

}


/* =====================================================
   CHOOSE ANSWER
===================================================== */

function choose(
  index,
  letter
){

  if(submitted){

    return;

  }


  answers[index] =
    letter;


  document
    .querySelectorAll(
      `[id^="opt-${index}-"]`
    )
    .forEach(
      element =>
        element.classList.remove(
          'selected'
        )
    );


  const selected =
    document.getElementById(
      `opt-${index}-${letter}`
    );


  if(selected){

    selected.classList.add(
      'selected'
    );

  }

}


/* =====================================================
   SUBMIT CHALLENGE
===================================================== */

async function submitChallenge(){

  if(submitted){

    return;

  }


  const submitButton =
    document.querySelector(
      '.submit'
    );


  if(submitButton){

    submitButton.disabled =
      true;

    submitButton.textContent =
      'Submitting…';

  }


  let score =
    0;


  questions.forEach(
    (question,index) => {

      const chosen =
        answers[index];


      const correct =
        String(
          question.Correct_Answer ||
          ''
        )
        .trim()
        .toUpperCase();


      if(
        chosen ===
        correct
      ){

        score++;

      }

    }
  );


  const saved =
    await saveChallengeResult(
      score
    );


  if(!saved){

    if(submitButton){

      submitButton.disabled =
        false;

      submitButton.textContent =
        'Submit Challenge';

    }


    return;

  }


  submitted =
    true;


  /* =================================================
     SHOW ANSWERS
  ================================================= */

  questions.forEach(
    (question,index) => {

      const chosen =
        answers[index];


      const correct =
        String(
          question.Correct_Answer ||
          ''
        )
        .trim()
        .toUpperCase();


      document
        .querySelectorAll(
          `[id^="opt-${index}-"]`
        )
        .forEach(
          element =>
            element.disabled = true
        );


      if(!chosen){

        return;

      }


      const selected =
        document.getElementById(
          `opt-${index}-${chosen}`
        );


      if(
        chosen ===
        correct
      ){

        if(selected){

          selected.classList.add(
            'correct'
          );

        }

      }else{

        if(selected){

          selected.classList.add(
            'wrong'
          );

        }


        const right =
          document.getElementById(
            `opt-${index}-${correct}`
          );


        if(right){

          right.classList.add(
            'correct'
          );

        }

      }

    }
  );


  /* =================================================
     RESULT
  ================================================= */

  const percentage =
    Math.round(
      score /
      questions.length *
      100
    );


  const result =
    document.getElementById(
      'result'
    );


  if(result){

    result.style.display =
      'block';


    result.innerHTML = `

      <strong>
        You scored
        ${score}/${questions.length}
        (${percentage}%).
      </strong>

      <p
        style="margin:8px 0 0"
      >
        🔥 Your streak and
        🏆 leaderboard have been updated.
      </p>

    `;

  }


  await loadStats();

}


/* =====================================================
   SAVE CHALLENGE RESULT
===================================================== */

async function saveChallengeResult(
  score
){

  const today =
    localDate();


  try{

    /* ===============================================
       CHECK EXISTING RESULT
    =============================================== */

    const {
      data:existing,
      error:checkError
    } =
      await client
        .from('challenge_attempts')
        .select(
          'id,score,total'
        )
        .eq(
          'user_id',
          user.id
        )
        .eq(
          'challenge_date',
          today
        )
        .maybeSingle();


    if(checkError){

      throw checkError;

    }


    if(existing){

      const card =
        document.getElementById(
          'challengeCard'
        );


      if(card){

        card.innerHTML = `

          <div class="message">

            <h2>
              ✅ Today’s Challenge Completed
            </h2>

            <p>
              Your challenge for today
              has already been recorded.
            </p>

          </div>

        `;

      }


      return true;

    }


    /* ===============================================
       DISPLAY NAME
    =============================================== */

    const displayName =
      await getDisplayName();


    /* ===============================================
       PAYLOAD
    =============================================== */

    const payload = {

      user_id:
        user.id,

      display_name:
        displayName,

      challenge_date:
        today,

      score:
        score,

      total:
        questions.length,

      completed_at:
        new Date().toISOString()

    };


    /* ===============================================
       SAVE
    =============================================== */

    const {
      error
    } =
      await client
        .from('challenge_attempts')
        .upsert(
          payload,
          {
            onConflict:
              'user_id,challenge_date'
          }
        );


    if(error){

      /*
       * Another submission may have been
       * recorded at exactly the same time.
       */

      if(
        String(error.code) ===
        '23505'
      ){

        const card =
          document.getElementById(
            'challengeCard'
          );


        if(card){

          card.innerHTML = `

            <div class="message">

              <h2>
                ✅ Today’s Challenge Completed
              </h2>

              <p>
                Your challenge has already
                been recorded.
              </p>

            </div>

          `;

        }


        return true;

      }


      throw error;

    }


    return true;


  }catch(error){

    console.error(
      'Challenge result save error:',
      error
    );


    alert(
      'Your challenge could not be saved: ' +
      (
        error?.message ||
        'Unknown error'
      )
    );


    return false;

  }

}


/* =====================================================
   START APP
===================================================== */

load();

</script>
