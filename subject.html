<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamPilot - Select Subjects</title>
    <link rel="stylesheet" href="brand.css">
    <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
    <meta name="theme-color" content="#14213D">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="redesign.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div id="pageContent">

        <img class="ep-logo ep-logo--header" src="assets/logo/logo-compact.svg" alt="ExamPilot">
        <h1>ExamPilot Practice</h1>

        <h2>Select 4 Subjects</h2>

        <p id="accessMessage"></p>

        <p id="count">
            Selected: 0 / 4
        </p>

        <label>
            <input type="checkbox" value="English">
            English Language
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Mathematics">
            Mathematics
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Physics">
            Physics
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Chemistry">
            Chemistry
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Biology">
            Biology
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Government">
            Government
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Economics">
            Economics
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Literature">
            Literature
        </label>

        <label>
            <input type="checkbox" value="CRS">
            Christian Religious Studies (CRS)
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="History">
            History
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Geography">
            Geography
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Commerce">
            Commerce
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Accounting">
            Accounting
        </label>

        <br><br>

        <br><br>

        <button onclick="startTest()">
            Start Test
        </button>

        <br><br>

        <button onclick="goBack()">
            Back to Dashboard
        </button>

    </div>


    <script>

        // ========================================
        // SUPABASE CONNECTION
        // ========================================

        const SUPABASE_URL =
            "https://afdnfqmsjmpwlvhloopy.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_LQlMraaULDTdAKeYysPWkA_a8CKvA1V";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ========================================
        // VARIABLES
        // ========================================

        let studentLoggedIn = false;

        let studentSubscribed = false;


        // ========================================
        // CHECK LOGIN AND SUBSCRIPTION
        // ========================================

        async function checkAccess() {

            try {

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                // ==================================
                // CHECK LOGIN
                // ==================================

                let user = null;
                let isOffline = false;

                if (
                    sessionError ||
                    !sessionData ||
                    !sessionData.session
                ) {
                    const rawOffline = localStorage.getItem("examPilotOfflineSession");
                    if (rawOffline) {
                        try {
                            const offlineSession = JSON.parse(rawOffline);
                            if (offlineSession && offlineSession.userId) {
                                isOffline = true;
                                user = { id: offlineSession.userId, email: offlineSession.email || "" };
                            }
                        } catch (e) {}
                    }

                    if (!user) {
                        alert(
                            "Please login before accessing ExamPilot practice."
                        );

                        window.location.href =
                            "student.html";

                        return false;
                    }

                } else {
                    user = sessionData.session.user;
                }


                studentLoggedIn = true;


                if (isOffline) {
                    studentSubscribed = false;
                    const message = document.getElementById("accessMessage");
                    if (message) {
                        message.innerHTML =
                            "🆓 <strong>Free Practice:</strong> " +
                            "You can answer up to 15 free questions.";
                    }
                    return true;
                }


                // ==================================
                // CHECK SUBSCRIPTION
                // ==================================

                const {
                    data: subscription,
                    error
                } =
                    await supabaseClient
                        .from("subscriptions")
                        .select(
                            "status, expires_at"
                        )
                        .eq(
                            "user_id",
                            user.id
                        )
                        .order(
                            "id",
                            {
                                ascending: false
                            }
                        )
                        .limit(1)
                        .maybeSingle();


                // ==================================
                // SUBSCRIPTION ERROR
                // ==================================

                if (error) {

                    console.log(
                        "Subscription check error:",
                        error
                    );

                    /*
                     * IMPORTANT:
                     *
                     * A subscription error must NOT
                     * block the 15 free questions.
                     *
                     * The student is still allowed
                     * to use free practice.
                     */

                    studentSubscribed = false;

                }


                // ==================================
                // NO SUBSCRIPTION
                // ==================================

                else if (!subscription) {

                    studentSubscribed = false;

                }


                // ==================================
                // SUBSCRIPTION EXISTS
                // ==================================

                else {

                    const status =
                        String(
                            subscription.status || ""
                        )
                        .trim()
                        .toLowerCase();


                    let notExpired = true;


                    if (
                        subscription.expires_at
                    ) {

                        const expiry =
                            new Date(
                                subscription.expires_at
                            );


                        if (
                            Number.isNaN(
                                expiry.getTime()
                            )
                        ) {

                            notExpired = false;

                        }

                        else {

                            notExpired =
                                expiry > new Date();

                        }

                    }


                    studentSubscribed =
                        (
                            status === "subscribed" &&
                            notExpired
                        );

                }


                // ==================================
                // SHOW ACCESS MESSAGE
                // ==================================

                const message =
                    document.getElementById(
                        "accessMessage"
                    );


                if (studentSubscribed) {

                    message.innerHTML =

                        "✅ <strong>Subscribed:</strong> " +
                        "You have full CBT practice access.";

                }

                else {

                    message.innerHTML =

                        "🆓 <strong>Free Practice:</strong> " +
                        "You can answer up to 15 free questions.";

                }


                console.log(
                    "Student logged in:",
                    studentLoggedIn
                );


                console.log(
                    "Student subscribed:",
                    studentSubscribed
                );


                return true;

            }

            catch (error) {

                console.log(
                    "Access check error:",
                    error
                );


                /*
                 * DO NOT BLOCK FREE ACCESS
                 * because of a subscription error.
                 */

                if (studentLoggedIn) {

                    studentSubscribed = false;

                    return true;

                }


                alert(
                    "Please login before accessing ExamPilot practice."
                );


                window.location.href =
                    "student.html";


                return false;

            }

        }


        // ========================================
        // SUBJECT SELECTION
        // ========================================

        const checkboxes =
            document.querySelectorAll(
                'input[type="checkbox"]'
            );


        const count =
            document.getElementById(
                "count"
            );


        checkboxes.forEach(
            function (checkbox) {

                checkbox.addEventListener(
                    "change",
                    function () {

                        let selected =
                            document.querySelectorAll(
                                'input[type="checkbox"]:checked'
                            );


                        if (
                            selected.length > 4
                        ) {

                            checkbox.checked =
                                false;


                            alert(
                                "You can only select 4 subjects."
                            );

                        }


                        count.textContent =
                            "Selected: " +
                            document.querySelectorAll(
                                'input[type="checkbox"]:checked'
                            ).length +
                            " / 4";

                    }
                );

            }
        );


        // ========================================
        // START TEST
        // ========================================

        async function startTest() {

            /*
             * Check login only.
             *
             * DO NOT require subscription here.
             */

            const allowed =
                await checkAccess();


            if (!allowed) {

                return;

            }


            // ==================================
            // CHECK SUBJECT COUNT
            // ==================================

            let selected =
                document.querySelectorAll(
                    'input[type="checkbox"]:checked'
                );


            if (
                selected.length !== 4
            ) {

                alert(
                    "Please select exactly 4 subjects."
                );

                return;

            }


            // ==================================
            // SAVE SUBJECTS
            // ==================================

            let subjects = [];


            selected.forEach(
                function (checkbox) {

                    subjects.push(
                        checkbox.value
                    );

                }
            );


            localStorage.setItem(
                "selectedSubjects",
                JSON.stringify(subjects)
            );


            // ==================================
            // SAVE PRACTICE TYPE
            // ==================================

            if (studentSubscribed) {

                localStorage.setItem(
                    "studentPractice",
                    "true"
                );

                localStorage.removeItem(
                    "freePractice"
                );

            }

            else {

                localStorage.setItem(
                    "freePractice",
                    "true"
                );

                localStorage.removeItem(
                    "studentPractice"
                );

            }


            // ==================================
            // GO TO TEST TYPE
            // ==================================

            window.location.href =
                "test-type.html";

        }


        // ========================================
        // BACK TO DASHBOARD
        // ========================================

        function goBack() {

            window.location.href =
                "student.html";

        }


        // ========================================
        // PROTECT PAGE ON OPEN
        // ========================================

        checkAccess();

    </script>

    <script src="pwa-register.js"></script>
</body>

</html>
