<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213D">
  <title>You're offline | ExamPilot</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #14213d;
      --slate: #53657a;
      --yellow: #f4c542;
      --surface: #ffffff;
      --background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background: var(--background);
    }
    main {
      width: min(100%, 430px);
      padding: 32px 28px;
      text-align: center;
      background: var(--surface);
      border: 1px solid #dde3ea;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(20, 33, 61, .08);
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0; color: var(--slate); line-height: 1.55; }
    .accent {
      width: 48px;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 4px;
      background: var(--yellow);
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="assets/logo/app-icon-512.png" alt="ExamPilot">
    <h1>You're currently offline</h1>
    <p>Previously cached ExamPilot content may still be available. Reconnect to continue using online features.</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
